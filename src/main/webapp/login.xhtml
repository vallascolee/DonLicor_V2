<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="jakarta.faces.passthrough">
    <h:head>
        <title>Iniciar Sesión - Don Licor V2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background: url('img/branding.jpg') no-repeat center center fixed;
                background-size: cover;
                height: 100vh;
                margin: 0;
            }
            /* Efecto Vidrio Traslúcido más transparente */
            .glass-card {
                background: rgba(15, 15, 15, 0.35);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(212, 175, 55, 0.35);
                border-radius: 16px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
                color: #ffffff;
            }
            .label-dorado {
                color: #d4af37 !important;
                font-size: 0.9rem;
                letter-spacing: 0.5px;
            }
            /* Campos de texto oscuros */
            .input-dark-custom {
                background-color: rgba(20, 20, 20, 0.85) !important;
                border: 1px solid #444 !important;
                color: #ffffff !important;
            }
            .input-dark-custom:focus {
                border-color: #d4af37 !important;
                box-shadow: 0 0 8px rgba(212, 175, 55, 0.4) !important;
            }
            /* Bloqueo del fondo blanco al autocompletar en navegadores */
            .input-dark-custom:-webkit-autofill,
            .input-dark-custom:-webkit-autofill:hover, 
            .input-dark-custom:-webkit-autofill:focus, 
            .input-dark-custom:-webkit-autofill:active {
                -webkit-box-shadow: 0 0 0 30px #1a1a1a inset !important;
                -webkit-text-fill-color: #ffffff !important;
                transition: background-color 5000s ease-in-out 0s;
            }
            .btn-dorado {
                background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
                border: none;
                color: #ffffff;
                font-weight: bold;
                letter-spacing: 0.5px;
                transition: all 0.3s ease;
            }
            .btn-dorado:hover {
                background: linear-gradient(135deg, #e6c555, #c29219);
                color: #000000;
                box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            }
        </style>
    </h:head>
    <h:body class="d-flex align-items-center justify-content-center">
        
        <!-- Tarjeta más pequeña (360px), con menos padding (p-4) y empujada hacia abajo (margin-top: 10vh) -->
        <div class="card glass-card p-4 shadow-lg" style="width: 360px; margin-top: 10vh;">
            <div class="card-body">
                
                <h:form>
                    <div class="mb-3">
                        <label class="form-label fw-bold label-dorado mb-2">Correo Electrónico</label>
                        <h:inputText value="#{loginBean.correo}" class="form-control input-dark-custom py-2" required="true" />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold label-dorado mb-2">Contraseña</label>
                        <h:inputSecret value="#{loginBean.password}" class="form-control input-dark-custom py-2" required="true" />
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <h:commandButton value="Ingresar al Sistema" action="#{loginBean.iniciarSesion}" class="btn btn-dorado btn-lg py-2 shadow-sm" />
                    </div>
                </h:form>
                
            </div>
        </div>

    </h:body>
</html>
