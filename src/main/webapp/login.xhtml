<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="jakarta.faces.passthrough">
    <h:head>
        <title>Iniciar Sesión - Don Licor V2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

        <style>
            /* 1. Estilos para que la imagen cubra todo el fondo de la pantalla */
            body {
                background-image: url('img/branding.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                height: 100vh; /* Altura del 100% de la ventana */
                display: flex;
                align-items: center; /* Centra el formulario verticalmente */
                margin: 0;
            }

            /* 2. Estilos para la tarjeta del formulario (Efecto cristal) */
            .tarjeta-login {
                background-color: rgba(255, 255, 255, 0.90); /* Fondo blanco con 10% de transparencia */
                backdrop-filter: blur(8px); /* Difumina lo que hay detrás de la tarjeta */
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); /* Sombra pronunciada para separar del fondo oscuro */
            }
        </style>
    </h:head>

    <h:body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">

                    <div class="card tarjeta-login border-0">
                        <div class="card-body p-4 p-md-5">

                            <h2 class="text-center text-primary mb-4 fw-bold">Don Licor</h2>

                            <!-- ETIQUETA NUEVA: Aquí aparecerán los errores de color rojo -->
                            <h:messages globalOnly="true" class="alert alert-danger list-unstyled p-3 rounded" />

                            <h2 class="text-center text-primary mb-4 fw-bold">Don Licor</h2>

                            <!-- Formulario JSF -->
                            <h:form>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Correo Electrónico</label>
                                    <h:inputText value="#{loginBean.correo}" class="form-control form-control-lg" p:placeholder="ejemplo@donlicor.com" required="true" />
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold">Contraseña</label>
                                    <h:inputSecret value="#{loginBean.password}" class="form-control form-control-lg" p:placeholder="******" required="true" />
                                </div>

                                <div class="d-grid mt-4">
                                    <h:commandButton value="Ingresar al Sistema" action="#{loginBean.iniciarSesion}" class="btn btn-primary btn-lg fw-bold" />
                                </div>
                            </h:form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </h:body>
</html>
