<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Dashboard - Don Licor V2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    </h:head>
    <h:body class="bg-light">
        
        <div class="container mt-5">
            <div class="card shadow p-5 text-center">
                <h1 class="text-success mb-3">¡Bienvenido a Don Licor V2! 🚀</h1>
                
                <!-- Aquí JSF imprime el nombre del usuario que inició sesión -->
                <h3>Hola, <h:outputText value="#{loginBean.usuarioLogueado.nombre}" class="text-primary fw-bold" /></h3>
                
                <p class="text-muted mt-2">Has superado la arquitectura de seguridad e iniciado sesión correctamente.</p>
                
                <h:form class="mt-4">
                    <!-- Botón que ejecuta la función de limpiar la memoria y salir -->
                    <h:commandButton value="Cerrar Sesión" action="#{loginBean.cerrarSesion}" class="btn btn-outline-danger px-4" />
                </h:form>
            </div>
        </div>
        
    </h:body>
</html>
