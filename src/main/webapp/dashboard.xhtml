<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Dashboard - Don Licor V2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    </h:head>
    <h:body class="bg-light">

        <!-- Barra de Navegación -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">🚀 Don Licor V2</a>
                <div class="d-flex">
                    <h:form>
                        <!-- Botón de cerrar sesión movido a la barra superior -->
                        <h:commandButton value="Cerrar Sesión" action="#{loginBean.cerrarSesion}" class="btn btn-outline-danger btn-sm fw-bold" />
                    </h:form>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <div class="text-center mb-5">



                <!-- Saludo dinámico -->
                <h2 class="text-success fw-bold">¡Bienvenido, <h:outputText value="#{loginBean.usuarioLogueado.nombre}" />!</h2>
                <p class="text-muted">Panel de Administración Principal</p>
            </div>

            <!-- Contenedor principal de las tarjetas envuelto en un formulario para que los botones funcionen -->
            <h:form>
                <div class="row justify-content-center mt-5">

                    <!-- 1. Tarjeta del Módulo de Usuarios -->
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100 shadow-sm border-0 text-center">
                            <div class="card-body p-5">
                                <h1 class="display-4 text-primary mb-3">👥</h1>
                                <h4 class="card-title fw-bold">Gestión de Usuarios</h4>
                                <p class="card-text text-muted mb-4">Crea, edita y elimina los accesos al sistema.</p>
                                <h:commandButton value="Ingresar al Módulo" action="usuarios.xhtml?faces-redirect=true" class="btn btn-primary w-100 fw-bold" />
                            </div>
                        </div>
                    </div>

                    <!-- 2. Tarjeta del Módulo de Inventario -->
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100 shadow-sm border-0 text-center">
                            <div class="card-body p-5">
                                <h1 class="display-4 text-success mb-3">📦</h1>
                                <h4 class="card-title fw-bold">Inventario</h4>
                                <p class="card-text text-muted mb-4">Controla productos, stock, precios y categorías.</p>
                                <h:commandButton value="Ingresar al Módulo" action="productos.xhtml?faces-redirect=true" class="btn btn-success w-100 fw-bold" />
                            </div>
                        </div>
                    </div>

                </div>
            </h:form>
        </div>

    </h:body>
</html>
